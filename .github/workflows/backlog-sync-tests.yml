name: Repository regression checks

on:
  pull_request:
    paths:
      - "scripts/backlog-sync-core.cjs"
      - "scripts/backlog-sync-core.test.cjs"
      - ".github/workflows/sync-backlog-to-issues.yml"
      - ".github/workflows/backlog-sync-tests.yml"
      - "scripts/validate-backlog.mjs"
      - "docs/TASK_BACKLOG.md"
      - "docs/MILESTONES.md"
      - "package.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "src/**"
      - "src-tauri/**"
      - "docs/DEVELOPMENT.md"
  push:
    branches: [main]
    paths:
      - "scripts/backlog-sync-core.cjs"
      - "scripts/backlog-sync-core.test.cjs"
      - ".github/workflows/sync-backlog-to-issues.yml"
      - ".github/workflows/backlog-sync-tests.yml"
      - "scripts/validate-backlog.mjs"
      - "docs/TASK_BACKLOG.md"
      - "docs/MILESTONES.md"
      - "package.json"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "src/**"
      - "src-tauri/**"
      - "docs/DEVELOPMENT.md"

permissions:
  contents: read

concurrency:
  group: backlog-sync-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Backlog sync regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test reconciliation and dry-run safety
        run: node --test scripts/backlog-sync-core.test.cjs
      - name: Validate backlog and local links
        run: node scripts/validate-backlog.mjs

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Verify supported Node and npm majors
        run: node -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)" && npm --version | grep -E '^11\.'
      - name: Install dependencies
        run: npm install
      - name: Check frontend formatting
        run: npm run format:check
      - name: Run root lint command
        run: npm run lint
      - name: Run root test command
        run: npm test
      - name: Run root typecheck command
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Validate Tauri configuration JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')); JSON.parse(require('node:fs').readFileSync('src-tauri/capabilities/default.json', 'utf8'));"

  rust-quality:
    name: Rust format and Clippy
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable quality tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
