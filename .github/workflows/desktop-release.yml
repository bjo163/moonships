name: Desktop alpha release

on:
  push:
    branches:
      - "release/v*.*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and publish Windows alpha installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out release branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect an already published release
        id: release-state
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check the tag list first: querying a missing release can leave a non-zero
          # native exit code that PowerShell propagates after the step script completes.
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME -replace "^release/", ""
          $existingTags = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName --jq ".[].tagName" 2>$null
          $listExitCode = $LASTEXITCODE
          if ($listExitCode -ne 0) { throw "Could not list existing GitHub releases." }
          if ($existingTags -contains $tag) {
            $assetCount = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq ".assets | length" 2>$null
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing release assets." }
            if ([int]$assetCount -ge 2) {
              "already_published=true" >> $env:GITHUB_OUTPUT
            } else {
              "already_published=false" >> $env:GITHUB_OUTPUT
            }
          } else {
            "already_published=false" >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0

      - name: Set up Node.js 24 LTS
        if: steps.release-state.outputs.already_published != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify supported runtime
        if: steps.release-state.outputs.already_published != 'true'
        shell: pwsh
        run: |
          $nodeMajor = (node -p "process.versions.node.split('.')[0]")
          $npmMajor = (npm --version).Split('.')[0]
          if ($nodeMajor -ne "24") { throw "Node.js 24 is required; found $nodeMajor" }
          if ($npmMajor -ne "11") { throw "npm 11 is required; found $npmMajor" }
          node --version
          npm --version

      - name: Install Rust MSVC toolchain
        if: steps.release-state.outputs.already_published != 'true'
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        if: steps.release-state.outputs.already_published != 'true'
        run: npm install

      - name: Normalize source formatting before release checks
        if: steps.release-state.outputs.already_published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx biome format --write src vite.config.ts vitest.config.ts index.html
          if ($LASTEXITCODE -ne 0) { throw "Biome formatting failed." }
          $changed = git status --porcelain
          if ($changed) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src vite.config.ts vitest.config.ts index.html
            git commit -m "style: apply Biome formatting for alpha.2 release"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit formatter output." }
            $pushUrl = "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
            git push $pushUrl "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw "Could not push formatter commit to the release branch." }
            Write-Host "Formatting commit pushed. A fresh workflow run will validate the exact committed source."
            exit 0
          }
      - name: Run frontend, repository and build checks
        if: steps.release-state.outputs.already_published != 'true'
        run: npm run check

      - name: Check Rust formatting
        if: steps.release-state.outputs.already_published != 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust unit tests
        if: steps.release-state.outputs.already_published != 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Clippy with warnings denied
        if: steps.release-state.outputs.already_published != 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build MSI and NSIS installers
        if: steps.release-state.outputs.already_published != 'true'
        run: npm run tauri -- build

      - name: Verify installer outputs
        if: steps.release-state.outputs.already_published != 'true'
        id: installers
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $msi) { throw "MSI installer was not produced" }
          if (-not $nsis) { throw "NSIS installer was not produced" }
          "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "nsis_path=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          Get-Item $msi.FullName, $nsis.FullName | Select-Object Name, Length

      - name: Publish GitHub Release with installers
        if: contains(github.ref_name, '.') && steps.release-state.outputs.already_published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME -replace "^release/", ""
          gh release create $tag "${{ steps.installers.outputs.msi_path }}" "${{ steps.installers.outputs.nsis_path }}" --target $env:GITHUB_SHA --title "Moonships $tag" --generate-notes --prerelease
          if ($LASTEXITCODE -ne 0) {
            $assetCount = gh release view $tag --json assets --jq ".assets | length"
            if ($LASTEXITCODE -ne 0 -or [int]$assetCount -lt 2) {
              throw "Release creation failed and no complete existing release was found."
            }
            gh release edit $tag --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not mark the existing release as a prerelease." }
            Write-Host "Release already exists with $assetCount assets; confirmed prerelease status."
          }

      - name: Mark existing release as prerelease
        if: steps.release-state.outputs.already_published == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME -replace "^release/", ""
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease
