[package]
name = "moonships"
version = "0.1.0-2"
description = "Moonships Workbench desktop application"
authors = ["Moonships contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "moonships_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.14.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
